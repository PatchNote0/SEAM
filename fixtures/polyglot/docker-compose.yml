services:
  web:
    build: ./web
    environment:
      VITE_API_URL: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://ledgerline:ledgerline@db:5432/ledgerline
      LEDGER_URL: http://ledger:8080
    ports:
      - "8000:8000"
    depends_on:
      - db
      - ledger

  ledger:
    build: ./ledger
    environment:
      LEDGER_DB_URL: postgresql://ledgerline:ledgerline@db:5432/ledgerline
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
      POSTGRES_DB: ledgerline
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

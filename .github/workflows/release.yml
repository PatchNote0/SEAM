name: Release

# Publishing a release on GitHub with a new tag such as v0.1.0, or pushing
# that tag, builds every target, attaches the archives and their checksums to
# the release, fills in its notes from CHANGELOG.md when they are empty, and
# pushes the container image. A release published from GitHub's page creates
# its tag, which is the event this workflow listens for. Running the workflow
# by hand builds and tests the archives without publishing anything.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip, run: true }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz, run: true }
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz, run: false }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, archive: tar.gz, run: true, docker: amd64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, archive: tar.gz, run: true, docker: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      # Static Linux builds: the C in the grammars and in SQLite goes through musl.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p seam-cli --target ${{ matrix.target }}
      - name: Run it on the fixture
        if: matrix.run
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/seam"
          "$bin" --version
          "$bin" scan fixtures/polyglot --no-store --color never
          "$bin" scan fixtures/polyglot --no-store --lang fa --color never > /dev/null
          "$bin" report fixtures/polyglot --format json > /dev/null
      - name: Package
        id: package
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          if [[ "$version" != v* ]]; then
            version="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          name="seam-${version}-${{ matrix.target }}"
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/seam$ext" "dist/$name/"
          cp README.md README.fa.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          echo "file=dist/$name.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
      - name: Keep the binary for the container image
        if: matrix.docker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-${{ matrix.docker }}
          path: target/${{ matrix.target }}/release/seam
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## " v " ") == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          test -s notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "SEAM $GITHUB_REF_NAME" --notes-file notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "SEAM $GITHUB_REF_NAME" --notes-file notes.md
          fi

  container:
    name: Publish the container image
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-amd64
          path: dist/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-arm64
          path: dist/arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/patchnote0/seam
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=seam
            org.opencontainers.image.description=Find, prove and track the Seams between the parts of a system.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
repository = "https://github.com/PatchNote0/seam"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
seam-core = { path = "crates/seam-core" }
seam-adapters = { path = "crates/seam-adapters" }
seam-analysis = { path = "crates/seam-analysis" }
seam-storage = { path = "crates/seam-storage" }

anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
ignore = "0.4.34"
rayon = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
